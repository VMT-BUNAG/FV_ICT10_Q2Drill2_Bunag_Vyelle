<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ICT Club Members</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-image: url("https://i.pinimg.com/originals/aa/25/47/aa2547be4d4885662603f4ba40de8735.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            padding: 30px 20px;
            font-family: Georgia, serif;
            color: #89566b;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-card {
            background: rgba(255, 245, 249, 0.90);
            border: 1px solid #e9b9cc;
            border-radius: 25px;
            padding: 35px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 8px 25px rgba(143, 79, 106, 0.12);
        }

        h1 {
            text-align: center;
            font-size: 32px;
            color: #bd7895;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 30px;
            color: #a7798d;
        }

        h5 {
            color: #bd7895;
            font-size: 17px;
            margin-bottom: 16px;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid #e8bdcf;
            border-radius: 14px;
            padding: 13px 15px;
            margin-bottom: 14px;
            color: #89566b;
            font-family: Georgia, serif;
        }

        .form-control:focus {
            border-color: #d99bb5;
            box-shadow: 0 0 0 3px rgba(217, 155, 181, 0.2);
            background: white;
        }

        .submit-btn {
            background: #d99bb5;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 12px 30px;
            display: block;
            margin: 8px auto 28px;
            font-family: Georgia, serif;
            font-size: 17px;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #bd7895;
            color: white;
            transform: translateY(-2px);
        }

        .members-box {
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid #efd0dc;
            border-radius: 18px;
            padding: 25px 28px;
            width: 100%;
        }

        #member-results {
            color: #89566b;
            font-size: 15px;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }

        .total {
            border-top: 1px solid #e9c5d4;
            margin-top: 18px;
            padding-top: 14px;
            font-size: 13px;
            letter-spacing: 1px;
            text-align: right;
        }

        .page-footer {
            width: 100%;
            text-align: center;
            color: #89566b;
            font-size: 12px;
            letter-spacing: 1px;
            padding-top: 18px;
            margin-top: 22px;
            border-top: 1px solid #e9c5d4;
        }

        .page-footer span {
            display: inline-block;
            margin-top: 8px;
            font-size: 10px;
            color: #a7798d;
            letter-spacing: 1.5px;
        }

        .bow {
            text-align: center;
            color: #d99bb5;
            font-size: 22px;
            margin-top: 18px;
        }

        @media (max-width: 480px) {
            .main-card {
                padding: 25px 18px;
            }

            .members-box {
                padding: 20px 16px;
            }

            h1 {
                font-size: 27px;
            }

            .page-footer span {
                letter-spacing: 1px;
            }
        }
    </style>
</head>


<body>

    <div class="main-card">

        <h1>ICT Club</h1>
        <p class="subtitle">MEMBER DIRECTORY</p>

        <h5>୨୧ Add a new member</h5>

        <input type="text" id="first_name" class="form-control" placeholder="First name">

        <input type="text" id="last_name" class="form-control" placeholder="Last name">

        <button class="submit-btn" py-click="add_member">
            Submit
        </button>

        <div class="members-box" id="members-box" style="display: none;">

            <h5>♡ All Members</h5>

            <div id="member-results"></div>

            <div class="total" id="member-total"></div>

        </div>

        <footer class="page-footer">
            made with ano for ICT Club
            <br>
            <span>୨୧ &nbsp; puro stock knowledge, bagsak tuloy sa college &nbsp; ୨୧</span>
        </footer>

        <div class="bow">୨୧</div>

    </div>

    <script type="py" src="./main.py"></script>

</body>
</html>
